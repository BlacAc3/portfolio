<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>The Black Ace — Aaron Ezeala, Full-Stack Engineer</title>
        <meta
            name="description"
            content="Aaron Ezeala — full-stack engineer building high-fidelity platforms with Django, React and Go. Selected works, technical toolkit and contact."
        />
        <meta name="theme-color" content="#1a1612" />
        <meta name="color-scheme" content="dark light" />
        <!-- Resolve the theme before first paint so there is no flash of the
             wrong one: saved choice → OS preference → dark. Kept in sync with
             src/contexts/ThemeContext.tsx. -->
        <script>
            (function () {
                var t;
                try { t = localStorage.getItem("theme"); } catch (e) {}
                if (t !== "light" && t !== "dark") {
                    t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
                }
                var d = document.documentElement;
                d.dataset.theme = t;
                d.style.colorScheme = t;
                var m = document.querySelector('meta[name="theme-color"]');
                if (m) m.setAttribute("content", t === "light" ? "#e8e0d3" : "#1a1612");
            })();
        </script>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="The Black Ace" />
        <meta property="og:title" content="The Black Ace — Aaron Ezeala, Full-Stack Engineer" />
        <meta
            property="og:description"
            content="Full-stack engineer building high-fidelity platforms with Django, React and Go."
        />
        <meta property="og:image" content="/favicon.svg" />
